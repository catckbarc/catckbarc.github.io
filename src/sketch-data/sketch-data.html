<link rel="import" href="../../bower_components/polymer/polymer.html" />
<link rel="import" href="../sketch-history/sketch-history.html" />

<dom-module id="sketch-data">
	<script>
		Polymer({
			is: "sketch-data",

			behaviors: [Sketch.HistoryBehavior],

			listeners: {
				undo: "_onUndo",
				redo: "_onRedo",
			},

			// Public properties

			properties: {
				currentLines: {
					type: Array,
					value: [],
					notify: true,
				},
				lines: {
					type: Array,
					value: [],
					notify: true,
					readOnly: true,
				},
				tonePoints: {
					type: Set,
					value: new Set(),
					readOnly: true,
				},
				length: {
					type: Number,
					value: 0,
					notify: true,
					readOnly: true,
				},
				maxLength: {
					// On the main garyc.me gallery, this is 64kB - 1.
					// On the noz.rip gallery, this is 128kB - 1.
					type: Number,
					value: 65535,
					notify: true,
				},
				hidden: {
					type: Boolean,
					value: false,
				},
				limitedInk: {
					type: Boolean,
					notify: true,
					value: true,
				},
				pixelBrush: {
					type: Boolean,
					value: false,
				},
			},

			get data() {
				var lines = this._clip(this.lines)

				if (this.hidden) {
					var arrayBuffer = new ArrayBuffer(
						Math.max(0, lines.length - 1) +
							2 *
								lines.reduce(
									(sum, line) => sum + line.length,
									0,
								),
					)
					var data = new Uint8Array(arrayBuffer)
					var n = 0

					for (var i = 0; i < lines.length; i++) {
						if (i > 0) {
							data[n] = " ".charCodeAt(0)
							n++
						}

						for (var j = 0; j < lines[i].length; j++) {
							var value = lines[i][j]
							if (value < 73) {
								var coordinate = this._pad(
									lines[i][j].toString(36),
									2,
								)
								data[n] = coordinate.charCodeAt(0)
								n++
								data[n] = coordinate.charCodeAt(1)
								n++
							} else {
								data[n] = Math.floor((lines[i][j] - 73) / 36)
									.toString(36)
									.charCodeAt(0)
								n++
								data[n] = 128 + ((lines[i][j] - 73) % 36)
								n++
							}
						}
					}

					return arrayBuffer
				} else {
					var data = []

					for (var i = 0; i < lines.length; i++) {
						var line = new Array(lines[i].length)

						for (var j = 0; j < lines[i].length; j++) {
							line[j] = this._pad(
								Math.floor(lines[i][j]).toString(36),
								2,
							)
						}

						data.push(line.join(""))
					}

					return data.join(" ")
				}
			},

			set data(data) {
				var oldLines = this.lines.slice()
				var lines = data.length > 0 ? data.split(" ") : []
				this._setLength(data.length)
				this._setLines(new Array(lines.length))
				this._setTonePoints(new Set())

				for (var i = 0; i < lines.length; i++) {
					var line = new Array((lines[i].length / 2) | 0)

					for (var j = 0; j < line.length * 2; j += 2) {
						line[j / 2] = parseInt(lines[i].substr(j, 2), 36)
					}

					if (this._isDot(line)) {
						this.tonePoints.add(`${line[0]}:${line[1]}`)
					} else if (this._isGalleryDot(line)) {
						line = [line[0], line[1], line[0], line[1]]
						this.tonePoints.add(`${line[0]}:${line[1]}`)
					}

					this.lines[i] = line
				}

				var action = [
					{
						start: 0,
						added: this.lines.slice(),
						removed: oldLines,
					},
				]

				this.pushHistory(action)
			},

			get swapData() {
				const oldLines = this.lines
				const newLines = this.lines.map((line) => line.slice())

				for (var i = 0; i < newLines.length; i++) {
					let line = newLines[i]
					// offset dots for visibility on the gallery since the
					// canvas there uses a flat lineCap
					if (this._isDot(line)) {
						var x = line[0]
						var y = line[1]
						let topleftOffset = Math.max(
							x - Math.max(x - 1, 0),
							y - Math.max(y - 1, 0),
						)
						newLines[i] = [
							x - topleftOffset,
							y - topleftOffset,
							x + 1,
							y + 1,
						]
					}
				}

				this._setLines(newLines)
				var data = this.data
				this._setLines(oldLines)
				return data
			},

			// Private properties

			_action: null,

			_canvasData: null,

			_moveDist: null,

			_miniMoveTimestamp: 0,

			_miniMoveAction: null,

			// Public functions, tool-related

			drawStart: function () {
				this.currentLines = [[]]
				this._pixelPoints = new Set()
				this._setLength(this.length + (this.lines.length == 0 ? 0 : 1))
			},

			draw: function (x, y, px, py) {
				if (this.pixelBrush) {
					return this._drawPixels(x, y, px, py)
				}
				if (this.limitedInk && this.length + 4 > this.maxLength) {
					return
				}

				let currentLine = this.currentLines.at(-1)
				const rect = [
					[0, 0],
					[800, 600],
				]
				const outOfBounds =
					!this._within([px, py], rect) && !this._within([x, y], rect)
				const exitingBounds =
					this._within([px, py], rect) && !this._within([x, y], rect)
				const enteringBounds =
					!this._within([px, py], rect) && this._within([x, y], rect)

				if (outOfBounds) {
					return []
				} else if (exitingBounds) {
					const [clipped] = this._clip([[px, py, x, y]])
					// Add the [x, y] end of the clip.
					// If [px, py] was smack on the canvas boundaries,
					// the clip would've just been [[px, py]]; no [x, y] end.
					if (clipped.length >= 4) {
						const [cx, cy] = clipped.slice(2)
						currentLine.push(cx, cy)
					}
				} else if (enteringBounds) {
					this.currentLines.push([])
					currentLine = this.currentLines.at(-1)

					const [clipped] = this._clip([[px, py, x, y]])
					currentLine.push(...clipped)
					this._setLength(this.length + 5) // 5 = space + extra point
				} else {
					currentLine.push(x, y)
				}

				this._setLength(this.length + 4)
				return currentLine.slice(
					currentLine.length - 4,
					currentLine.length,
				)
			},

			_drawPixels: function (x, y, px, py) {
				const pixelSize = 3
				const startX = Math.floor(px / pixelSize) * pixelSize
				const startY = Math.floor(py / pixelSize) * pixelSize
				const endX = Math.floor(x / pixelSize) * pixelSize
				const endY = Math.floor(y / pixelSize) * pixelSize
				const distance = Math.max(
					Math.abs(endX - startX),
					Math.abs(endY - startY),
				)
				const steps = Math.max(1, Math.ceil(distance / pixelSize))
				const currentLines = this.currentLines
				let lastLine = currentLines.at(-1)
				let added = 0
				for (let step = 0; step <= steps; step++) {
					const gridX = Math.round(
						startX + ((endX - startX) * step) / steps,
					)
					const gridY = Math.round(
						startY + ((endY - startY) * step) / steps,
					)
					if (
						gridX < 0 ||
						gridY < 0 ||
						gridX >= 800 ||
						gridY >= 600
					) {
						continue
					}
					const point = `${gridX}:${gridY}`
					if (!this._pixelPoints) this._pixelPoints = new Set()
					if (this._pixelPoints.has(point)) continue
					if (this.limitedInk && this.length + 8 > this.maxLength) {
						break
					}
					this._pixelPoints.add(point)
					const line = [
						gridX,
						gridY,
						Math.min(800, gridX + pixelSize),
						gridY,
					]
					line.pixelBrush = true
					if (lastLine.length == 0) {
						currentLines[currentLines.length - 1] = line
					} else {
						currentLines.push(line)
					}
					lastLine = line
					added++
				}
				this._setLength(this.length + added * 8)
				return lastLine || []
			},

			drawEnd: function (lines = this.currentLines) {
				// lines with only 1 point should be dealt with in sketch-canvas
				// threshold is only such in case draw() rejects adding the extra point
				const currentLine = lines.at(-1)
				if (currentLine.length > 2) {
					for (const line of lines) {
						if (this._isDot(line)) {
							this.tonePoints.add(`${line[0]}:${line[1]}`)
						}
					}

					var action = {
						start: this.lines.length,
						added: lines.slice(),
						removed: [],
					}
					this.push("lines", ...lines)
					this.pushHistory([action])
				} else {
					this._setLength(
						this.length -
							currentLine.length * 2 -
							(this.lines.length == 0 ? 0 : 1),
					)
				}
			},

			eraseStart: function () {
				this._action = []
			},

			erase: function (
				x,
				y,
				px,
				py,
				radius,
				eraseStrokes,
				eraseScreentoneOnly = false,
			) {
				const actions = []
				const lines = this.lines.slice()

				for (var i = lines.length - 1; i >= 0; i--) {
					var line = lines[i]
					if (eraseScreentoneOnly && !this._isScreentoneLine(line)) {
						continue
					}
					const hitRadius = this._isDot(line) ? radius + 1.5 : radius
					const added = []
					let current = []
					let hit = false

					const keepCurrent = () => {
						if (current.length > 2) {
							added.push(current)
						}
						current = []
					}

					if (eraseStrokes || this._isDot(line)) {
						for (var j = 0; j < line.length; j += 2) {
							if (
								this._insideCircle(
									line[j],
									line[j + 1],
									x,
									y,
									hitRadius,
								) ||
								(j + 3 < line.length &&
									this._segmentsWithinDistance(
										line[j],
										line[j + 1],
										line[j + 2],
										line[j + 3],
										px,
										py,
										x,
										y,
										hitRadius,
									))
							) {
								hit = true
								break
							}
						}
					} else {
						for (var j = 0; j < line.length - 2; j += 2) {
							const segmentHit =
								this._insideCircle(
									line[j],
									line[j + 1],
									x,
									y,
									hitRadius,
								) ||
								this._insideCircle(
									line[j + 2],
									line[j + 3],
									x,
									y,
									hitRadius,
								) ||
								this._segmentsWithinDistance(
									line[j],
									line[j + 1],
									line[j + 2],
									line[j + 3],
									px,
									py,
									x,
									y,
									hitRadius,
								)

							if (segmentHit) {
								hit = true
								keepCurrent()
								continue
							}

							if (current.length == 0) {
								current.push(line[j], line[j + 1])
							}
							current.push(line[j + 2], line[j + 3])
						}
						keepCurrent()
					}

					if (hit) {
						actions.push({
							start: i,
							added: eraseStrokes ? [] : added,
							removed: [line],
						})
					}
				}

				for (const action of actions) {
					this._doAction([action])
					this._action.push(action)
				}

				return actions.length > 0
			},

			eraseEnd: function () {
				if (this._action.length > 0) {
					this.pushHistory(this._action)
				}
			},

			fill: function (x, y, canvas, mode = "normal", modeSettings = {}) {
				const ctx = canvas.getContext("2d")
				const transform = ctx.getTransform()
				this._canvasData = ctx.getImageData(0, 0, 800, 600).data
				this._canvasFlipped = transform.e == 800 && transform.a == -1

				if (!this._fillable(x, y)) {
					return []
				}

				const action = {
					start: this.lines.length,
					added: [],
					removed: [],
				}

				// Using the span filling algorithm, but with custom angle support
				// https://en.wikipedia.org/wiki/Flood_fill#Span_filling

				const slope = this._degreesToSlope(modeSettings.angle)
				const xInclined = -1 <= slope && slope <= 1
				const vertical = Math.abs(slope) == Infinity
				const xinc = xInclined ? 1 : vertical ? 0 : 1 / slope
				const yinc = xInclined ? slope : 1

				// using typed array to save memory
				// extend mask dimensions by 1px to support axes x=800 and y=600
				const mask = new Uint8Array(801 * 601)
				const maskLines = []
				const queue = [[x, y]]
				for (
					let queueIndex = 0;
					queueIndex < queue.length;
					queueIndex++
				) {
					/** @type {number[]} */
					const [qx, qy] = queue[queueIndex]

					if (mask[this._maskIndex(qx, qy)]) {
						continue
					}

					let lx = qx
					let ly = qy
					let rx = qx
					let ry = qy

					// Scan our left and right until we reach the first unfillable pixel.
					for (; this._fillable(lx, ly); lx -= xinc, ly -= yinc) {
						mask[this._maskIndex(lx, ly)] = 1
					}
					for (; this._fillable(rx, ry); rx += xinc, ry += yinc) {
						mask[this._maskIndex(rx, ry)] = 1
					}

					// Reduce until the first fillable pixel.
					// Queuing on the first unfillable would've caused chaos.
					lx += xinc
					ly += yinc
					rx -= xinc
					ry -= yinc
					// Queue lines above and below our scanline
					if (xInclined) {
						queue.push(
							...this._scanLineForPoints(
								slope,
								lx,
								ly - 1,
								rx,
								ry - 1,
							),
						)
						queue.push(
							...this._scanLineForPoints(
								slope,
								lx,
								ly + 1,
								rx,
								ry + 1,
							),
						)
					} else {
						queue.push(
							...this._scanLineForPoints(
								slope,
								lx - 1,
								ly,
								rx - 1,
								ry,
							),
						)
						queue.push(
							...this._scanLineForPoints(
								slope,
								lx + 1,
								ly,
								rx + 1,
								ry,
							),
						)
					}

					// Push the line.
					maskLines.push([lx, ly, rx, ry])
				}

				modeSettings.limitedInk = this.limitedInk
				action.added = this._fillPattern(
					slope,
					maskLines,
					mode,
					modeSettings,
				)

				if (action.added.length >= 1) {
					this._doAction([action])
					this.pushHistory([action])
				}
				this._pixelPoints = new Set()

				return action.added.slice()
			},

			moveStart: function () {
				this._moveDist = { x: 0, y: 0 }
				this._action = [
					{
						move: { x: 0, y: 0 },
					},
				]
			},

			move: function (x, y, px, py) {
				const dx = x - px
				const dy = y - py
				this._moveDist.x += dx
				this._moveDist.y += dy
				this._action[0].move.x += dx
				this._action[0].move.y += dy
				this._translateLines(dx, dy)
			},

			moveEnd: function () {
				if (this.tonePoints.size >= 1) {
					const movedTonePoints = new Set()
					for (const tone of this.tonePoints) {
						let [x, y] = tone.split(":")
						x = parseInt(x) + this._moveDist.x
						y = parseInt(y) + this._moveDist.y
						movedTonePoints.add(`${x}:${y}`)
					}
					this._setTonePoints(movedTonePoints)
				}

				if (this.lines.length > 0) {
					const action = this._action[0]
					this.pushHistory(this._action)

					// Just in case we do mini-moves after this main move
					this._miniMoveTimestamp = performance.now()
					this._miniMoveAction = this._action
				}
			},

			miniMove: function (dx, dy) {
				if (this.lines.length == 0) {
					return
				}

				let action
				const timestamp = performance.now()
				const headAction = this.history[this.head - 1]
				const sameHeadAction =
					this.history.length >= 1 &&
					headAction == this._miniMoveAction
				const sameTimestampWindow =
					timestamp - this._miniMoveTimestamp < 2000
				if (sameHeadAction && sameTimestampWindow) {
					action = headAction
					if (action[0].move) {
						action[0].move.x += dx
						action[0].move.y += dy
						this._translateLines(dx, dy)
						this._translateTonePoints(dx, dy)
						this._miniMoveTimestamp = timestamp
						this._miniMoveAction = action
						return
					}
				} else {
					action = [
						{
							start: 0,
							added: [],
							removed: this.lines.slice(),
						},
					]
					this.pushHistory(action)
				}

				const movedLines = this.lines.map((line) => {
					const moved = line.slice()
					for (let i = 0; i < line.length; i += 2) {
						moved[i] += dx
						moved[i + 1] += dy
					}
					return moved
				})

				action[0].added = movedLines
				this._doAction(action)
				this._miniMoveTimestamp = timestamp
				this._miniMoveAction = action
			},

			toneStart: function () {
				this._strokeTonePattern = null
				this._strokeTonePoints = null
				this._action = [
					{
						start: this.lines.length,
						added: [],
						removed: [],
					},
				]
			},

			tone: function (x, y, px, py, options) {
				const rect = [
					[0, 0],
					[800, 600],
				]
				const action = this._action[0]
				const { pattern, radius, spacing } = options
				this._tonePattern = pattern
				this._toneRadius = radius
				this._toneSpacing = spacing
				if (this._strokeTonePattern != pattern) {
					this._strokeTonePattern = pattern
					this._strokeTonePoints = new Set(
						this.lines
							.filter((line) => line.tonePattern == pattern)
							.map(
								(line) =>
									line.crossPoint ||
									(this._isDot(line)
										? `${line[0]}:${line[1]}`
										: null),
							)
							.filter(Boolean),
					)
				}
				const strokeTonePoints = this._strokeTonePoints

				const tones = []

				let accumLength = this.length

				if (pattern == "horizontal" || pattern == "vertical") {
					const horizontal = pattern == "horizontal"
					const lineSpacing = spacing * 2
					const axis = horizontal ? 0 : 1
					const fixedAxis = horizontal ? 1 : 0
					const center = horizontal ? y : x
					const position = horizontal ? x : y
					const first = center - radius
					const last = center + radius

					for (
						let fixed = first - (first % lineSpacing);
						fixed <= last;
						fixed += lineSpacing
					) {
						const distance = fixed - center
						if (Math.abs(distance) > radius) continue
						const half = Math.max(
							1,
							Math.floor(
								Math.sqrt(
									radius * radius - distance * distance,
								),
							),
						)
						const candidateLow = Math.max(0, position - half)
						const candidateHigh = Math.min(
							horizontal ? 800 : 600,
							position + half,
						)
						if (candidateLow > candidateHigh) continue
						const covered = this.lines
							.filter(
								(line) =>
									line.tonePattern == pattern &&
									line.length == 4 &&
									line[fixedAxis] == fixed &&
									line[fixedAxis + 2] == fixed,
							)
							.map((line) => [
								Math.min(line[axis], line[axis + 2]),
								Math.max(line[axis], line[axis + 2]),
							])
							.sort((a, b) => a[0] - b[0])
							.reduce((merged, interval) => {
								const previous = merged.at(-1)
								if (
									previous &&
									interval[0] <= previous[1] + 1
								) {
									previous[1] = Math.max(
										previous[1],
										interval[1],
									)
								} else {
									merged.push(interval)
								}
								return merged
							}, [])
						const originalCovered = covered.map((interval) =>
							interval.slice(),
						)
						const bridge = radius * 2 + spacing
						const connectors = []
						for (const interval of covered) {
							if (
								candidateLow > interval[1] &&
								candidateLow - interval[1] <= bridge
							) {
								connectors.push(
									horizontal
										? [
												interval[1],
												fixed,
												candidateLow,
												fixed,
											]
										: [
												fixed,
												interval[1],
												fixed,
												candidateLow,
											],
								)
								connectors.at(-1).tonePattern = pattern
								interval[1] = candidateLow - 1
							} else if (
								interval[0] > candidateHigh &&
								interval[0] - candidateHigh <= bridge
							) {
								connectors.push(
									horizontal
										? [
												candidateHigh,
												fixed,
												interval[0],
												fixed,
											]
										: [
												fixed,
												candidateHigh,
												fixed,
												interval[0],
											],
								)
								connectors.at(-1).tonePattern = pattern
								interval[0] = candidateHigh + 1
							}
						}

						let open = [[candidateLow, candidateHigh]]
						for (const [coveredLow, coveredHigh] of covered) {
							open = open.flatMap(([openLow, openHigh]) => {
								if (
									coveredHigh < openLow ||
									coveredLow > openHigh
								) {
									return [[openLow, openHigh]]
								}
								return [
									...(openLow < coveredLow
										? [[openLow, coveredLow - 1]]
										: []),
									...(openHigh > coveredHigh
										? [[coveredHigh + 1, openHigh]]
										: []),
								]
							})
						}
						const leftOverlap = covered.reduce(
							(overlap, [, coveredHigh]) =>
								candidateLow <= coveredHigh + bridge &&
								candidateHigh > coveredHigh
									? Math.max(overlap, coveredHigh)
									: overlap,
							-1,
						)
						const rightOverlap = covered.reduce(
							(overlap, [coveredLow]) =>
								coveredLow <= candidateHigh + bridge &&
								coveredLow > candidateHigh
									? Math.min(overlap, coveredLow)
									: overlap,
							Infinity,
						)

						for (const line of connectors) {
							const lineLength = 8 + (accumLength > 0)
							if (
								this.limitedInk &&
								accumLength + lineLength > this.maxLength
							) {
								return tones
							}
							tones.push(line)
							action.added.push(line)
							accumLength += lineLength
						}

						for (const [low, high] of open) {
							let extendedLow = low
							let extendedHigh = high
							for (const [
								coveredLow,
								coveredHigh,
							] of originalCovered) {
								if (
									coveredHigh < extendedLow &&
									extendedLow - coveredHigh <= bridge
								) {
									extendedLow = coveredHigh
								}
								if (
									coveredLow > extendedHigh &&
									coveredLow - extendedHigh <= bridge
								) {
									extendedHigh = coveredLow
								}
							}
							const overlapLow =
								leftOverlap >= 0
									? Math.min(extendedLow, leftOverlap)
									: extendedLow
							const overlapHigh =
								rightOverlap < Infinity
									? Math.max(extendedHigh, rightOverlap)
									: extendedHigh
							if (overlapLow > overlapHigh) continue
							const line = horizontal
								? [overlapLow, fixed, overlapHigh, fixed]
								: [fixed, overlapLow, fixed, overlapHigh]
							line.tonePattern = pattern
							const lineLength = 8 + (accumLength > 0)
							if (
								this.limitedInk &&
								accumLength + lineLength > this.maxLength
							) {
								return tones
							}
							tones.push(line)
							action.added.push(line)
							accumLength += lineLength
						}
					}

					if (tones.length > 0) {
						this._setLength(accumLength)
						this.push("lines", ...tones)
					}
					this.toneEnd(false)
					return tones
				}

				if (pattern == "square") {
					const squareSpacing = spacing + 1
					var sX = x - radius - ((x - radius) % squareSpacing)
					var sY = y - radius - ((y - radius) % squareSpacing)
					var eX = x + radius
					var eY = y + radius
					const ones = tones

					xLoop: for (var i = sX; i <= eX; i += squareSpacing) {
						yLoop: for (var j = sY; j <= eY; j += squareSpacing) {
							let toneLength = 8 + (accumLength > 0)
							if (
								this.limitedInk &&
								accumLength + toneLength > this.maxLength
							) {
								break xLoop
							}

							const tonepoint = `${i}:${j}`
							if (
								!this._within([i, j], rect) ||
								!this._insideCircle(x, y, i, j, radius) ||
								strokeTonePoints.has(tonepoint)
							) {
								continue
							}

							this.tonePoints.add(tonepoint)
							strokeTonePoints.add(tonepoint)
							const square = [
								Math.max(0, i - 1),
								j,
								Math.min(800, i + 2),
								j,
							]
							square.tonePattern = pattern
							square.crossTone = true
							square.crossPoint = tonepoint
							ones.push(square)
							action.added.push(square)
							accumLength += toneLength
						}
					}
					if (tones.length > 0) {
						this._setLength(accumLength)
						this.push("lines", ...tones)
					}
					return tones
				}

				// credits to noz for the original screentoning algorithm

				// anchoring the loop to start at the nearest possible tone point at the top-left
				const dotSpacing =
					pattern == "normal" || pattern == "diagonal"
						? spacing + 1
						: spacing
				var sX = x - radius - ((x - radius) % dotSpacing)
				var sY = y - radius - ((y - radius) % dotSpacing)
				var eX = x + radius
				var eY = y + radius

				const ones = tones
				xLoop: for (var i = sX; i <= eX; i += dotSpacing) {
					yLoop: for (var j = sY; j <= eY; j += dotSpacing) {
						let toneLength = 8 + (accumLength > 0)
						if (
							this.limitedInk &&
							accumLength + toneLength > this.maxLength
						) {
							break xLoop
						}

						const tonepoint = `${i}:${j}`

						if (
							this._within([i, j], rect) &&
							this._insideCircle(x, y, i, j, radius) &&
							this._matchesTonePattern(
								pattern,
								i,
								j,
								dotSpacing,
							) &&
							!strokeTonePoints.has(tonepoint)
						) {
							this.tonePoints.add(tonepoint)
							strokeTonePoints.add(tonepoint)
							const line = [i, j, i, j]
							line.tonePattern = pattern
							ones.push(line)
							accumLength += toneLength
						}
					}
				}

				if (tones.length >= 1) {
					this._setLength(accumLength)
					this.push("lines", ...tones)
					action.added.push(...tones)
				}

				return tones
			},

			toneEnd: function (finalize = true) {
				const action = this._action[0]
				const tones = action.added
				if (
					tones.length > 1 &&
					(this._tonePattern == "horizontal" ||
						this._tonePattern == "vertical") &&
					(tones[0][1] == tones[0][3] || tones[0][0] == tones[0][2])
				) {
					const horizontal = tones[0][1] == tones[0][3]
					const axis = horizontal ? 0 : 1
					const fixedAxis = horizontal ? 1 : 0
					const merged = []
					const grouped = new Map()
					for (const tone of tones) {
						const fixed = tone[fixedAxis]
						if (!grouped.has(fixed)) grouped.set(fixed, [])
						grouped
							.get(fixed)
							.push([
								Math.min(tone[axis], tone[axis + 2]),
								Math.max(tone[axis], tone[axis + 2]),
							])
					}
					for (const [fixed, intervals] of grouped) {
						intervals.sort((a, b) => a[0] - b[0])
						let [low, high] = intervals[0]
						for (const [nextLow, nextHigh] of intervals.slice(1)) {
							if (nextLow <= high + 1) {
								high = Math.max(high, nextHigh)
							} else {
								merged.push(
									horizontal
										? [low, fixed, high, fixed]
										: [fixed, low, fixed, high],
								)
								;[low, high] = [nextLow, nextHigh]
							}
						}
						merged.push(
							horizontal
								? [low, fixed, high, fixed]
								: [fixed, low, fixed, high],
						)
					}

					for (const line of merged) {
						line.tonePattern = this._tonePattern
					}
					this.splice("lines", action.start, tones.length, ...merged)
					action.added = merged
					this._setLength(
						this.lines.reduce(
							(sum, line, index) =>
								sum + line.length * 2 + (index > 0 ? 1 : 0),
							0,
						),
					)
				}
				if (finalize && tones.length >= 1) {
					this.pushHistory(this._action)
				}
			},

			// Other public functions

			/**
			 * Flips sketch data *in-place*.
			 */
			flip: function () {
				for (let i = 0; i < this.lines.length; i++) {
					const line = this.lines[i]

					for (let j = 0; j < line.length; j += 2) {
						line[j] = 800 - line[j]
					}
				}
			},

			/**
			 * Regenerates sketch data by traversing the undo history.
			 */
			refreshLines: function () {
				const newlines = []
				for (let i = 0; i < this.head; i++) {
					const actions = this.history[i]
					for (const action of actions) {
						if (action.move) {
							for (const line of newlines) {
								for (let j = 0; j < line.length; j += 2) {
									line[j] += action.move.x
									line[j + 1] += action.move.y
								}
							}
							continue
						}
						newlines.splice(
							action.start,
							action.removed.length,
							...action.added,
						)
					}
				}

				let newlength = 0
				let newtonepoints = new Set()
				for (let index in newlines) {
					const line = newlines[index]
					if (this._isDot(line) || line.crossTone) {
						newtonepoints.add(
							line.crossPoint || `${line[0]}:${line[1]}`,
						)
					}
					newlength += line.length * 2 + (index > 0)
				}

				this._setLength(newlength)
				this._setLines(newlines)
				this._setTonePoints(newtonepoints)
			},

			// Private functions

			_onUndo: function (event) {
				this._undoAction(event.detail)
			},

			_onRedo: function (event) {
				this._doAction(event.detail)
			},

			_translateLines: function (dx, dy) {
				const translated = this.lines.map(function (line) {
					const moved = line.slice()
					for (let i = 0; i < moved.length; i += 2) {
						moved[i] += dx
						moved[i + 1] += dy
					}
					return moved
				})
				this._setLines(translated)
			},

			_translateTonePoints: function (dx, dy) {
				const translated = new Set()
				for (const tone of this.tonePoints) {
					const [x, y] = tone.split(":")
					translated.add(`${parseInt(x) + dx}:${parseInt(y) + dy}`)
				}
				this._setTonePoints(translated)
			},

			_doAction: function (action) {
				var oldLength = this.lines.length
				let addedLength = 0
				let removedLength = 0

				for (var i in action) {
					if (action[i].move) {
						this._translateLines(action[i].move.x, action[i].move.y)
						this._translateTonePoints(
							action[i].move.x,
							action[i].move.y,
						)
						continue
					}
					Array.prototype.splice.apply(
						this.lines,
						[action[i].start, action[i].removed.length].concat(
							action[i].added,
						),
					)

					for (const addedLine of action[i].added) {
						addedLength += addedLine.length * 2 + 1
						if (this._isDot(addedLine) || addedLine.crossTone) {
							this.tonePoints.add(
								addedLine.crossPoint ||
									`${addedLine[0]}:${addedLine[1]}`,
							)
						}
					}

					for (const removedLine of action[i].removed) {
						removedLength += removedLine.length * 2 + 1
						if (this._isDot(removedLine) || removedLine.crossTone) {
							this.tonePoints.delete(
								removedLine.crossPoint ||
									`${removedLine[0]}:${removedLine[1]}`,
							)
						}
					}
				}

				this._setLength(this.length + addedLength - removedLength)

				if (oldLength == 0 && this.lines.length > 0) {
					this._setLength(this.length - 1)
				}

				if (oldLength > 0 && this.lines.length == 0) {
					this._setLength(0)
				}
			},

			_undoAction: function (action) {
				var oldLength = this.lines.length
				let addedLength = 0
				let removedLength = 0
				var actionR = action.slice(0).reverse()

				for (var i in actionR) {
					if (actionR[i].move) {
						this._translateLines(
							-actionR[i].move.x,
							-actionR[i].move.y,
						)
						this._translateTonePoints(
							-actionR[i].move.x,
							-actionR[i].move.y,
						)
						continue
					}
					Array.prototype.splice.apply(
						this.lines,
						[actionR[i].start, actionR[i].added.length].concat(
							actionR[i].removed,
						),
					)

					for (const addedLine of actionR[i].added) {
						addedLength += addedLine.length * 2 + 1
						if (this._isDot(addedLine) || addedLine.crossTone) {
							this.tonePoints.delete(
								addedLine.crossPoint ||
									`${addedLine[0]}:${addedLine[1]}`,
							)
						}
					}

					for (const removedLine of actionR[i].removed) {
						removedLength += removedLine.length * 2 + 1
						if (this._isDot(removedLine) || removedLine.crossTone) {
							this.tonePoints.add(
								removedLine.crossPoint ||
									`${removedLine[0]}:${removedLine[1]}`,
							)
						}
					}
				}

				this._setLength(this.length - addedLength + removedLength)

				if (oldLength == 0 && this.lines.length > 0) {
					this._setLength(this.length - 1)
				}

				if (oldLength > 0 && this.lines.length == 0) {
					this._setLength(0)
				}
			},

			_fillPattern: function (
				slope,
				maskLines,
				type = "normal",
				settings = {},
			) {
				const rect = [
					[0, 0],
					[800, 600],
				]
				const xInclined = -1 <= slope && slope <= 1
				const vertical = Math.abs(slope) == Infinity
				const xinc = xInclined ? 1 : vertical ? 0 : 1 / slope
				const yinc = xInclined ? slope : 1

				var lines = []
				let accumLength = this.length

				switch (type) {
					case "normal": {
						const { limitedInk, spacing } = settings

						for (let line of maskLines) {
							let lineLength = 8 + (accumLength > 0)
							if (
								limitedInk &&
								accumLength + lineLength > this.maxLength
							) {
								break
							}

							const [x1, y1, x2, y2] = line
							const xInclined = -1 <= slope && slope <= 1
							let intercept
							if (slope == Infinity) {
								intercept = x1
							} else if (slope == 0) {
								intercept = y1
							} else if (xInclined) {
								intercept = y1 - slope * x1
							} else {
								intercept = x1 - y1 / slope
							}
							const modulo =
								((Math.round(intercept) % spacing) + spacing) %
								spacing

							if (modulo > 0) {
								continue
							}

							line = line.slice()

							// Extend fill lines by 2px to the right, 1px to the left.
							// - 1px right:
							//     Lines are drawn as vectors, not pixel-by-pixel,
							//     they'd be drawn 1px shorter than expected.
							//     That missing pixel would've been [line[2], line[3]].
							// - 1px right, 1px left:
							//     Mitigates some of the white space at the end of lines,
							//     especially for spaced diagonal fills.
							for (let i = 1; i <= 2; i++) {
								const extX = line[2] + xinc
								const extY = line[3] + yinc
								if (this._within([extX, extY], rect)) {
									line[2] = extX
									line[3] = extY
								}
							}
							const extX = line[0] - xinc
							const extY = line[1] - yinc
							if (this._within([extX, extY], rect)) {
								line[0] = extX
								line[1] = extY
							}

							lines.push(line)
							accumLength += lineLength
						}
						break
					}
					case "tone": {
						const { limitedInk, tonePattern, spacing } = settings

						lineLoop: for (let i in maskLines) {
							let line = maskLines[i]
							if (line[1] % spacing == 0) {
								let sX = Math.ceil(line[0] / spacing) * spacing

								toneLoop: for (
									let x = sX;
									x <= line[2] + 1;
									x += spacing
								) {
									let toneLength = 8 + (accumLength > 0)
									if (
										limitedInk &&
										accumLength + toneLength >
											this.maxLength
									) {
										break lineLoop
									}

									if (
										!this._matchesTonePattern(
											tonePattern,
											x,
											line[1],
											spacing,
										)
									) {
										continue
									}

									var toneLine = [x, line[1], x, line[1]]
									toneLine.tonePattern = tonePattern
									var tone = `${x}:${line[1]}`
									if (this.tonePoints.has(tone)) {
										continue
									}

									lines.push(toneLine)
									accumLength += toneLength
								}
							}
						}
						break
					}
					default: {
						throw new TypeError("Unknown fill pattern")
					}
				}

				return lines
			},

			_pad: function (n, width) {
				return (
					Math.pow(10, Math.max(0, width - n.length))
						.toString()
						.substr(1) + n
				)
			},

			_clip: function (lines) {
				const rect = [
					[0, 0],
					[800, 600],
				]

				return lines.flatMap((line) => {
					const newlines = []
					let current = []

					let lastpoint = line.slice(0, 2)
					if (this._within(lastpoint, rect)) {
						current.push(...lastpoint)
					}

					for (let i = 2; i < line.length; i += 2) {
						const point = line.slice(i, i + 2)

						if (this._within(point, rect)) {
							if (this._within(lastpoint, rect)) {
								current.push(...point)
							} else {
								const enterints = this._intersections(
									[lastpoint, point],
									rect,
								)
								current.push(...enterints.flat(), ...point)
							}
						} else if (this._within(lastpoint, rect)) {
							const exitints = this._intersections(
								[lastpoint, point],
								rect,
							)
							current.push(...exitints.flat())

							if (current.length >= 1) {
								if (current.length == 2) {
									current.push(...current)
								}
								newlines.push(current)
								current = []
							}
						} else {
							const enterexitints = this._intersections(
								[lastpoint, point],
								rect,
							)
							current.push(...enterexitints.flat())

							if (current.length >= 1) {
								if (current.length == 2) {
									current.push(...current)
								}
								newlines.push(current)
								current = []
							}
						}

						lastpoint = point
					}

					if (current.length >= 1) {
						if (current.length == 2) {
							current.push(...current)
						}
						newlines.push(current)
					}

					return newlines
				})
			},

			_intersections: function (line, rect) {
				const retpoints = []

				const [start, end] = line
				let lr = start[0] <= end[0] ? 1 : 0
				let ud = start[1] <= end[1] ? 1 : 0

				;[
					[1 - lr, 0],
					[1 - ud, 1], // entry tests
					[lr, 0],
					[ud, 1], // exit tests
				].forEach(([rectindex, axis]) => {
					const checkside = rect[rectindex]

					// Intersection check:
					// The line would be considered intersecting with the rect only if:
					// - start > check && end < check
					// - start < check && end > check
					// They don't intersect if they're both the same sign (i.e. same side)
					// or one of them is equal (i.e. right on top of the rect bounds).
					const startside = Math.sign(checkside[axis] - start[axis])
					const endside = Math.sign(checkside[axis] - end[axis])
					const intersecting = startside + endside == 0
					if (intersecting) {
						const other = 1 - axis

						let point = [
							checkside[axis],
							start[other] +
								((end[other] - start[other]) *
									(checkside[axis] - start[axis])) /
									(end[axis] - start[axis]),
						]

						const usingY = axis == 1
						if (usingY) {
							point.reverse()
						}

						const newcoord = point[other]
						const isCorner = newcoord == checkside[other]
						if (
							newcoord >= rect[0][other] &&
							newcoord <= rect[1][other] &&
							!(isCorner && usingY)
						) {
							point[other] = Math.round(point[other])
							retpoints.push(point)
						}
					}
				})

				return retpoints
			},

			// Private number methods

			/**
			 * Converts angle degrees into a y/x slope ratio.
			 *
			 * For reference:
			 *   - 0 degrees gives a slope of 0.
			 *   - 45 degrees gives a slope of 1.
			 *   - 90 degrees gives a slope of Infinity.
			 *   - -90 degrees gives a slope of -Infinity.
			 *   - -45 degrees gives a slope of -1, etc.
			 *
			 * @param {number} degrees The degrees of the angle.
			 * @returns {number} Its y/x slope ratio.
			 */
			_degreesToSlope: function (degrees) {
				const radians = (degrees * Math.PI) / 180
				const slopeRaw = Math.tan(radians)
				// Floating point error compensation
				const slope =
					Math.abs(slopeRaw) > 100 // only true for 89.42deg onwards; good enough
						? Math.sign(slopeRaw) * Infinity
						: Math.round(slopeRaw * 100000) / 100000
				return slope
			},

			// Private boolean methods

			/**
			 * Checks whether a point is within a given rectangle.
			 *
			 * @param {[number, number]} point
			 *    A two-tuple representing the point.
			 * @param {[[number, number], [number, number]]} rect
			 *    Two two-tuple points that represent the rectangle's top-left and
			 *    bottom-right corners.
			 *    Both of these points are inclusive.
			 * @returns {boolean}
			 */
			_within: function (point, rect) {
				return (
					point[0] >= rect[0][0] &&
					point[0] <= rect[1][0] &&
					point[1] >= rect[0][1] &&
					point[1] <= rect[1][1]
				)
			},

			_insideCircle: function (origin_x, origin_y, x, y, r) {
				return (
					(x - origin_x) * (x - origin_x) +
						(y - origin_y) * (y - origin_y) <=
					r * r
				)
			},

			_segmentsWithinDistance: function (
				ax,
				ay,
				bx,
				by,
				cx,
				cy,
				dx,
				dy,
				radius,
			) {
				const radiusSquared = radius * radius
				const segmentsIntersect = this._segmentsIntersect(
					ax,
					ay,
					bx,
					by,
					cx,
					cy,
					dx,
					dy,
				)

				return (
					segmentsIntersect ||
					this._pointToSegmentDistanceSquared(
						ax,
						ay,
						cx,
						cy,
						dx,
						dy,
					) <= radiusSquared ||
					this._pointToSegmentDistanceSquared(
						bx,
						by,
						cx,
						cy,
						dx,
						dy,
					) <= radiusSquared ||
					this._pointToSegmentDistanceSquared(
						cx,
						cy,
						ax,
						ay,
						bx,
						by,
					) <= radiusSquared ||
					this._pointToSegmentDistanceSquared(
						dx,
						dy,
						ax,
						ay,
						bx,
						by,
					) <= radiusSquared
				)
			},

			_pointToSegmentDistanceSquared: function (px, py, ax, ay, bx, by) {
				const abx = bx - ax
				const aby = by - ay
				const lengthSquared = abx * abx + aby * aby
				const projection =
					lengthSquared == 0
						? 0
						: ((px - ax) * abx + (py - ay) * aby) / lengthSquared
				const t = Math.max(0, Math.min(1, projection))
				const nearestX = ax + t * abx
				const nearestY = ay + t * aby
				const dxToPoint = px - nearestX
				const dyToPoint = py - nearestY
				return dxToPoint * dxToPoint + dyToPoint * dyToPoint
			},

			_segmentsIntersect: function (ax, ay, bx, by, cx, cy, dx, dy) {
				const denominator =
					(bx - ax) * (dy - cy) - (by - ay) * (dx - cx)
				if (denominator == 0) {
					return false
				}

				const t =
					((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) /
					denominator
				const u =
					((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) /
					denominator
				return t >= 0 && t <= 1 && u >= 0 && u <= 1
			},

			_isDot: function (line) {
				return (
					line.length == 4 && line[0] == line[2] && line[1] == line[3]
				)
			},

			_isGalleryDot: function (line) {
				return (
					line.length == 4 &&
					line[0] + 2 == line[2] &&
					line[1] + 2 == line[3]
				)
			},

			_hasTonePoint: function (pattern, tonepoint) {
				return this.lines.some(
					(line) =>
						line.tonePattern == pattern &&
						(line.crossPoint == tonepoint ||
							(this._isDot(line) &&
								`${line[0]}:${line[1]}` == tonepoint)),
				)
			},

			_isScreentoneLine: function (line) {
				return line.tonePattern != null || line.crossTone
			},

			_matchesTonePattern: function (pattern, x, y, spacing) {
				switch (pattern) {
					case "normal": {
						return true
					}

					case "diagonal": {
						let xOddEven = Math.abs(x) % (spacing * 2)
						let yOddEven = Math.abs(y) % (spacing * 2)
						return xOddEven == yOddEven // basically XNOR
					}

					default: {
						return true
					}
				}
			},

			// Private filling methods

			_maskIndex: function (x, y) {
				return Math.floor(y) * 801 + Math.floor(x)
			},

			_canvasIndex: function (x, y) {
				// Clamp coordinates to canvas data boundaries;
				// this is particularly useful for x=800 and y=600.
				// Probably not the best solution ever?
				x = Math.min(x, 800 - 1)
				y = Math.min(y, 600 - 1)

				x = this._canvasFlipped ? 800 - x : x

				return Math.floor(y) * 800 + Math.floor(x)
			},

			/**
			 * Returns whether a pixel is fillable on the canvas or not.
			 * Fillable here means any pixel that isn't pure black.
			 *
			 * @param {number} x  The x-coordinate of the pixel.
			 * @param {number} y  The y-coordinate of the pixel.
			 * @returns {boolean}
			 */
			_fillable: function (x, y) {
				const rect = [
					[0, 0],
					[800, 600],
				]
				const within = this._within([x, y], rect)
				const fillable =
					this._canvasData[this._canvasIndex(x, y) * 4] > 0
				return within && fillable
			},

			/**
			 * Iterates through a line and returns any potential points for the flood fill
			 * queue.
			 *
			 * @param {number} slope
			 * @param {number} lx
			 * @param {number} ly
			 * @param {number} rx
			 * @param {number} ry
			 * @returns {number[][]}
			 */
			_scanLineForPoints: function (slope, lx, ly, rx, ry) {
				const points = []
				let added = false

				const xInclined = -1 <= slope && slope <= 1
				const vertical = Math.abs(slope) == Infinity
				const xinc = xInclined ? 1 : vertical ? 0 : 1 / slope
				const yinc = xInclined ? slope : 1

				// Condition out of for loop statement just because it's easier
				// to read.
				for (let x = lx, y = ly; ; x += xinc, y += yinc) {
					const withinLine = xInclined ? x <= rx : y <= ry
					const fillable = this._fillable(x, y)

					if (!withinLine) {
						break
					}

					if (fillable && !added) {
						points.push([x, y])
						added = true
					} else if (!fillable) {
						added = false
					}
				}

				return points
			},
		})
	</script>
</dom-module>
