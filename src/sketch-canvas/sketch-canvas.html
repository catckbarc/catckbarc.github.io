<link rel="import" href="../../bower_components/polymer/polymer.html" />
<link
	rel="import"
	href="../../bower_components/iron-resizable-behavior/iron-resizable-behavior.html"
/>
<link rel="import" href="../../bower_components/paper-styles/shadow.html" />
<link rel="import" href="../sketch-data/sketch-data.html" />
<link rel="import" href="../sketch-etch/sketch-etch.html" />

<dom-module id="sketch-canvas">
	<template>
		<style>
			:host {
				--cursor: crosshair;

				@apply (--shadow-elevation-4dp);
				display: block;
				position: relative;
				cursor: var(--cursor);
				touch-action: none;

				-webkit-user-select: none;
				user-select: none;
			}

			#sketchCanvas {
				display: block;

				background: white;
				opacity: 0;
				touch-action: none;
			}

			#vectorCanvas {
				position: absolute;
				top: 0;
				left: 0;
				width: 800px;
				height: 600px;
				pointer-events: none;
			}
		</style>
		<canvas
			id="sketchCanvas"
			on-pointermove="_onPointerMove"
			on-pointerenter="_onPointerMove"
			on-pointerleave="_onPointerMove"
			on-pointerover="_onPointerMove"
			on-pointerout="_onPointerMove"
			on-pointerdown="_onPointerMove"
			on-pointerup="_onPointerMove"
			on-pointercancel="_onPointerMove"
			on-contextmenu="_onContextMenu"
			width="800"
			height="600"
		></canvas>
		<svg
			id="vectorCanvas"
			width="800"
			height="600"
			viewBox="0 0 800 600"
			aria-hidden="true"
		></svg>
		<sketch-data
			id="data"
			length="{{dataLength}}"
			max-length="{{maxDataLength}}"
			can-undo="{{dataCanUndo}}"
			can-redo="{{dataCanRedo}}"
			limited-ink="{{limitedInk}}"
		></sketch-data>
	</template>
	<script>
		;(function () {
			Polymer({
				is: "sketch-canvas",

				ready: function () {
					// Set up backup canvas to quickly rebuild already-drawn lines while drawing
					if (window.OffscreenCanvas) {
						const { width, height } = this.$.sketchCanvas
						const canvas2 = new OffscreenCanvas(width, height)
						this._canvas2 = canvas2.getContext("2d", {
							alpha: false,
						})
					} else {
						const canvas2 = document.createElement("canvas")
						canvas2.width = this.$.sketchCanvas.width
						canvas2.height = this.$.sketchCanvas.height
						this._canvas2 = canvas2.getContext("2d", {
							alpha: false,
						})
					}

					this._canvas = this.$.sketchCanvas.getContext("2d", {
						alpha: false,
						// This should force hardware-accelerated rendering whenever available;
						// If this was left unspecified, Chromium would've eventually switched
						// to software rendering if enough `.getImageData()` calls were made.
						// And its software rendering looks terrible, especially for fills.
						willReadFrequently: false,
					})
					// Restore rendering on GPU or other driver crashes
					this._canvas.canvas.addEventListener(
						"contextrestored",
						this._updateRendering.bind(this),
					)

					// Polymer seems to only start registering private properties for
					// computed ones only when they're assigned during ready().
					this._activeTool = null
					this._activeKeyTool = null

					this._bounds = this.getBoundingClientRect()

					this._updateRendering()
					this._clear()
				},

				behaviors: [Polymer.IronResizableBehavior, Sketch.EtchBehavior],

				listeners: {
					"iron-resize": "_onIronResize",
				},

				// Public properties

				properties: {
					ink: {
						type: Number,
						notify: true,
						readOnly: true,
						computed: "computeInk(maxDataLength, dataLength)",
					},
					drawing: {
						type: Boolean,
						notify: true,
						readOnly: true,
						value: false,
					},
					playing: {
						type: Boolean,
						notify: true,
						readOnly: true,
						value: false,
					},
					flipped: {
						type: Boolean,
						notify: true,
						value: false,
						observer: "_onFlippedChanged",
					},
					desiredTool: {
						type: String,
						value: "pen",
					},
					tool: {
						type: String,
						notify: true,
						readOnly: true,
						computed:
							"_tool(desiredTool, _activeTool, _activeKeyTool)",
						observer: "_onToolChanged",
					},
					lockTool: {
						type: Boolean,
						value: false,
						observer: "_onToolLocked",
					},
					disabled: {
						type: Boolean,
						notify: true,
						value: false,
					},
					canUndo: {
						type: Boolean,
						notify: true,
						computed: "_canEdit(dataCanUndo, disabled)",
					},
					canRedo: {
						type: Boolean,
						notify: true,
						computed: "_canEdit(dataCanRedo, disabled)",
					},
					cursor: {
						type: String,
						computed:
							"_cursor(disabled, tool, eraseStrokes, eraserRadius, toneRadius, _bounds)",
						observer: "_onCursorChanged",
					},

					// settings

					timeResolution: {
						type: Number,
						notify: true,
						value: 15,
					},
					ignoreTouch: {
						type: Boolean,
						notify: true,
						value: false,
					},
					animationSpeed: {
						// computed later as 10 ** (x/10 + 1)
						// might have to think of a better system for this sometime
						type: Number,
						notify: true,
						value: 10,
					},
					renderType: {
						// options: "vector", "mixed", "quackbarc", "clanker"
						type: String,
						notify: true,
						value: "mixed",
						observer: "_updateRendering",
					},

					// tool settings

					fillAngle: {
						type: Number,
						notify: true,
						value: 0,
					},
					fillSpacing: {
						type: Number,
						notify: true,
						value: 1,
					},
					fillScreentone: {
						type: Boolean,
						notify: true,
						value: false,
					},
					tonePattern: {
						// options: "normal", "diagonal"
						type: String,
						notify: true,
						value: "normal",
					},
					toneSpacing: {
						type: Number,
						notify: true,
						value: 6,
					},
					toneRadius: {
						type: Number,
						notify: true,
						value: 8,
					},
					toneOffsetX: {
						type: Number,
						notify: true,
						value: 0,
					},
					toneOffsetY: {
						type: Number,
						notify: true,
						value: 0,
					},
					eraserRadius: {
						type: Number,
						notify: true,
						value: 3,
					},
					eraseStrokes: {
						type: Boolean,
						computed:
							"_eraseStrokes(eraseStrokesSetting, activeStrokeErasing)",
					},
					eraseStrokesSetting: {
						type: Boolean,
						notify: true,
						value: false,
					},
					activeStrokeErasing: {
						type: Boolean,
						value: false,
					},

					// bubblers

					limitedInk: {
						type: Boolean,
						notify: true,
					},
					maxDataLength: {
						type: Number,
						notify: true,
					},
				},

				get data() {
					return this.$.data.data
				},

				set data(data) {
					this.$.data.data = data
					this._render()
				},

				get canvasURL() {
					return this.$.sketchCanvas.toDataURL("image/png")
				},

				// Private properties

				_activeKeyTool: null,

				_canvas: null,

				_canvas2: null,

				_rendering: false,

				_keepRendering: false,

				_playProgressLines: 0,

				_playProgressPoints: 0,

				_lastTimestamp: null,

				_bounds: null,

				_wasPressed: null,

				_wasPlaying: false,

				_lockedTool: null,

				_lastTool: null,

				_lastX: null,

				_lastY: null,

				_lastEventTimeStamp: 0,

				_pointerType: null,

				_penFilteredX: null,

				_penFilteredY: null,

				_penLastInputX: null,

				_penLastInputY: null,

				_penLastInputTime: null,

				_clankerLastVelocityX: null,

				_clankerLastVelocityY: null,

				// Public methods

				play: function () {
					this._clear()
					this._setPlaying(true)
					this._playProgressLines = 0
					this._playProgressPoints = 0
					this._lastTimestamp = null
					window.requestAnimationFrame(this._animate.bind(this))
				},

				stop: function (render = false) {
					this._setPlaying(false)
					if (render) {
						this._render()
					}
				},

				undo: function (event) {
					if (!this.disabled) {
						this.$.data.undo()
						this._render()
					}
				},

				redo: function (event) {
					if (!this.disabled) {
						this.$.data.redo()
						this._render()
					}
				},

				flip: function () {
					this.flipped = !this.flipped
				},

				refreshLines: function () {
					this.$.data.refreshLines()
					this._render()
				},

				computeInk: function (maxLength, dataLength) {
					return dataLength / maxLength
				},

				copyCanvas: function () {
					this.$.sketchCanvas.toBlob((blob) => {
						navigator.clipboard.write([
							new ClipboardItem({ "image/png": blob }),
						])
					})
				},

				// Private methods
				// Property observers

				_onIronResize: function (event) {
					this._bounds = this.getBoundingClientRect()
				},

				_onContextMenu(event) {
					event.preventDefault()
				},

				_onPointerMove(event) {
					let events = []

					if (event.getCoalescedEvents) {
						events = event.getCoalescedEvents()
					}

					if (events.length == 0) {
						events = [event]
					}

					for (let e of events) {
						this._processEvent(e)
					}
				},

				_onToolLocked(event) {
					if (!this._lockedTool) {
						this._lockedTool = this.tool
					}
				},

				_onToolChanged(event) {
					if (this.drawing && !this.disabled) {
						this._action(this._lastTool).end(
							this._lastX,
							this._lastY,
						)
						this._action(this.tool).start(this._lastX, this._lastY)
					}

					this._lastTool = this.tool
				},

				_onCursorChanged(event) {
					this.updateStyles({ "--cursor": this.cursor })
				},

				_onFlippedChanged(event) {
					if (!this._readied) {
						return
					}

					const transform = this.flipped ? { a: -1, e: 800 } : {}
					this._canvas.setTransform(transform)
					this._canvas2.setTransform(transform)
					this._render()
					if (this.drawing) {
						// Keep rendering a line that's being drawn while flipping.
						// It's kinda fun to look at.
						this.$.data.currentLines.forEach((line) =>
							this._drawLine(line),
						)
					}
				},

				_updateRendering: function (event) {
					if (!this._canvas) {
						return
					}

					this._canvas.strokeStyle = "black"
					this._canvas.lineWidth = 3
					this._canvas.fillStyle = "black"
					this._canvas.lineJoin = "round"
					this._canvas.lineCap = "butt"
					this.$.sketchCanvas.style.opacity =
						this.renderType == "quackbarc" ? "1" : "0"
					this.$.vectorCanvas.style.display =
						this.renderType == "quackbarc" ? "none" : "block"

					this._setPlaying(false)
					this._render()
					this._renderSVG()
				},

				// Pointer event handlers

				_processEvent(event) {
					if (this.playing) {
						if (event.buttons > 0) {
							this.stop()
							this._wasPlaying = true
						}
						return
					} else if (this._wasPlaying) {
						if (event.buttons == 0) {
							this._render()
							this._wasPlaying = false
						}
						return
					}

					if (this.disabled) {
						return
					}

					// thanks firefox
					if (
						this._pointerType != null &&
						this._pointerType != event.pointerType
					) {
						return
					}

					if (this.ignoreTouch && event.pointerType == "touch") {
						return
					}

					var pointerErasing =
						event.buttons == 32 || event.buttons == 2
					var pressed = event.buttons > 0

					var tool = pointerErasing ? "eraser" : this.tool
					var point = this._scaleCoordinates(
						this._bounds,
						event.clientX,
						event.clientY,
						800,
						600,
					)
					var x = this.flipped ? 800 - point[0] : point[0]
					var y = point[1]

					var moved = !(this._lastX == x && this._lastY == y)
					var isInBounds = x >= 0 && x < 800 && y >= 0 && y < 600
					var wasInBounds =
						this._lastX >= 0 &&
						this._lastX < 800 &&
						this._lastY >= 0 &&
						this._lastY < 600

					// prevent consecutive actions on the same coordinates
					if (!moved && this._wasPressed == pressed) {
						return
					}

					if (tool == "pan") {
						return
					}

					if (pressed) {
						this._pointerType =
							this._pointerType == null
								? event.pointerType
								: this._pointerType
						this._activeTool = pointerErasing ? "eraser" : null
						if (this._wasPressed) {
							const obeyTimeResolution = tool == "pen"
							if (
								obeyTimeResolution &&
								this.timeResolution != 0 &&
								this._timeResolved(event.timeStamp) -
									this._timeResolved(
										this._lastEventTimeStamp,
									) ==
									0
							) {
								return
							}
							if (
								tool == "pen" &&
								this.renderType != "quackbarc"
							) {
								const filteredPoint = this._filterPenPoint(
									x,
									y,
									event.timeStamp,
								)
								x = filteredPoint[0]
								y = filteredPoint[1]
							}
							this._action(tool).middle(
								x,
								y,
								this._lastX,
								this._lastY,
							)
						} else {
							if (!this.lockTool) {
								this._lockedTool = null
							}

							this.$.sketchCanvas.setPointerCapture(
								event.pointerId,
							)
							if (
								tool == "pen" &&
								this.renderType != "quackbarc"
							) {
								const filteredPoint = this._filterPenPoint(
									x,
									y,
									event.timeStamp,
								)
								x = filteredPoint[0]
								y = filteredPoint[1]
							}
							this._action(tool).start(x, y)
							this._setDrawing(true)
						}
					} else if (this._wasPressed) {
						this.$.sketchCanvas.releasePointerCapture(
							event.pointerId,
						)
						if (tool == "pen" && this.renderType != "quackbarc") {
							// Preserve the exact release position after slow-speed filtering.
							this._draw(x, y, this._lastX, this._lastY)
						}
						this._action(tool).end(x, y)
						this._setDrawing(false)

						this._pointerType = null
						this._activeTool = null
						this._penFilteredX = null
						this._penFilteredY = null
						this._penLastInputX = null
						this._penLastInputY = null
						this._penLastInputTime = null
						this._clankerLastVelocityX = null
						this._clankerLastVelocityY = null
					}

					this._lastEventTimeStamp = event.timeStamp
					this._wasPressed = pressed
					this._lastX = x
					this._lastY = y
				},

				_action: function (tool) {
					if (this._lockedTool && this._lockedTool != tool) {
						tool = null
					}

					switch (tool) {
						case "pan":
							return {
								start: () => void 0,
								middle: () => void 0,
								end: () => void 0,
							}
						case "eraser":
							return {
								start: this._eraseStart.bind(this),
								middle: this._erase.bind(this),
								end: this._eraseEnd.bind(this),
							}
						case "pen":
							return {
								start: this._drawStart.bind(this),
								middle: this._draw.bind(this),
								end: this._drawEnd.bind(this),
							}
						case "move":
							return {
								start: this._moveStart.bind(this),
								middle: this._move.bind(this),
								end: this._moveEnd.bind(this),
							}
						case "screentone":
							return {
								start: this._toneStart.bind(this),
								middle: this._tone.bind(this),
								end: this._toneEnd.bind(this),
							}
						case "fill":
							return {
								start: () => void 0,
								middle: () => void 0,
								end: this._fill.bind(this),
							}
						default:
							return {
								start: () => void 0,
								middle: () => void 0,
								end: () => void 0,
							}
					}
				},

				_scaleCoordinates: function (bounds, x, y, width, height) {
					x = Math.round((width * (x - bounds.left)) / bounds.width)
					y = Math.round((height * (y - bounds.top)) / bounds.height)
					return [x, y]
				},

				_filterPenPoint: function (x, y, timestamp) {
					if (this._penFilteredX == null) {
						this._penFilteredX = x
						this._penFilteredY = y
						this._penLastInputX = x
						this._penLastInputY = y
						this._penLastInputTime = timestamp
						this._penLastVelocityX = 0
						this._penLastVelocityY = 0
						return [x, y]
					}

					const elapsed = Math.max(
						timestamp - this._penLastInputTime,
						1,
					)
					const distance = Math.hypot(
						x - this._penLastInputX,
						y - this._penLastInputY,
					)
					const velocityX = x - this._penLastInputX
					const velocityY = y - this._penLastInputY
					const speed = distance / elapsed
					const speedRatio = Math.max(
						0,
						Math.min(1, (speed - 0.03) / 0.3),
					)
					const smoothRatio =
						speedRatio * speedRatio * (3 - 2 * speedRatio)
					let weight =
						this.renderType == "mixed"
							? 0.55 + smoothRatio * 0.35
							: this.renderType == "clanker"
								? 0.65 + smoothRatio * 0.2
								: 0.3 + smoothRatio * 0.5
					if (this.renderType == "clanker") {
						const previousSpeed = Math.hypot(
							this._clankerLastVelocityX || 0,
							this._clankerLastVelocityY || 0,
						)
						if (distance > 0 && previousSpeed > 0) {
							const cosine =
								(velocityX * this._clankerLastVelocityX +
									velocityY * this._clankerLastVelocityY) /
								(distance * previousSpeed)
							if (cosine < 0.707) {
								weight = 0.99
							} else if (cosine > 0.85) {
								x +=
									(this._penFilteredX - this._penLastInputX) *
									0.08
								y +=
									(this._penFilteredY - this._penLastInputY) *
									0.08
							}
							const endpoint = this._nearestParallelEndpoint(
								x,
								y,
								velocityX,
								velocityY,
							)
							if (endpoint) {
								x += (endpoint[0] - x) * 0.18
								y += (endpoint[1] - y) * 0.18
							}
						}
					}
					this._penFilteredX =
						x * weight + this._penFilteredX * (1 - weight)
					this._penFilteredY =
						y * weight + this._penFilteredY * (1 - weight)
					this._penLastInputX = x
					this._penLastInputY = y
					this._penLastInputTime = timestamp
					if (this.renderType == "clanker") {
						this._clankerLastVelocityX = velocityX
						this._clankerLastVelocityY = velocityY
					}
					return [this._penFilteredX, this._penFilteredY]
				},

				_nearestParallelEndpoint: function (
					x,
					y,
					velocityX,
					velocityY,
				) {
					const velocityLength = Math.hypot(velocityX, velocityY)
					if (velocityLength == 0) {
						return null
					}

					let nearest = null
					let nearestDistance = 12
					for (const line of this.$.data.lines) {
						for (const endpointIndex of [0, line.length - 2]) {
							const adjacentIndex =
								endpointIndex == 0 ? 2 : line.length - 4
							if (
								adjacentIndex < 0 ||
								adjacentIndex + 1 >= line.length
							) {
								continue
							}
							const segmentX =
								line[endpointIndex] - line[adjacentIndex]
							const segmentY =
								line[endpointIndex + 1] -
								line[adjacentIndex + 1]
							const segmentLength = Math.hypot(segmentX, segmentY)
							if (segmentLength == 0) {
								continue
							}
							const parallel = Math.abs(
								(velocityX * segmentX + velocityY * segmentY) /
									(velocityLength * segmentLength),
							)
							if (parallel < 0.85) {
								continue
							}
							const distance = Math.hypot(
								line[endpointIndex] - x,
								line[endpointIndex + 1] - y,
							)
							if (distance < nearestDistance) {
								nearestDistance = distance
								nearest = [
									line[endpointIndex],
									line[endpointIndex + 1],
								]
							}
						}
					}
					return nearest
				},

				_timeResolved: function (n) {
					return Math.floor(n / this.timeResolution)
				},

				// Tool handlers

				_drawStart(x, y) {
					this._canvas2.drawImage(this._canvas.canvas, 0, 0, 800, 600)
					this.$.data.drawStart()
					this._draw(x, y, x, y)
				},

				_draw(x, y, px, py) {
					this._canvas.drawImage(this._canvas2.canvas, 0, 0, 800, 600)
					this.$.data.draw(x, y, px, py)
					this.$.data.currentLines.forEach((line) =>
						this._drawLine(line),
					)
					this._renderSVG()
				},

				_drawEnd(x, y) {
					// Transform single dots into lines.
					// Checking the last line instead of any other line was a bit
					// of an arbitrary choice; even the first line would've worked.
					const lastLine = this.$.data.currentLines.at(-1)
					const lastLineIsDot = lastLine.length == 2
					if (lastLineIsDot) {
						this._draw(x, y, x, y)
					}

					this.$.data.drawEnd()
					this.$.data.currentLines = []
					this._renderSVG()
				},

				_eraseStart(x, y) {
					this.$.data.eraseStart()
					this._erase(x, y, x, y)
				},

				_erase(x, y, px, py) {
					var erased = this.$.data.erase(
						x,
						y,
						px,
						py,
						this.eraserRadius,
						this.eraseStrokes,
					)
					if (erased) {
						this._render()
					}
				},

				_eraseEnd(x, y) {
					this.$.data.eraseEnd()
				},

				_fill(x, y) {
					let fillLines
					if (this.fillScreentone) {
						fillLines = this.$.data.fill(
							x,
							y,
							this.$.sketchCanvas,
							"tone",
							{
								angle: 0,
								tonePattern: this.tonePattern,
								spacing: this.toneSpacing,
								offX: this.toneOffsetX,
								offY: this.toneOffsetY,
							},
						)
					} else {
						fillLines = this.$.data.fill(
							x,
							y,
							this.$.sketchCanvas,
							"normal",
							{
								angle: this.fillAngle,
								spacing: this.fillSpacing,
							},
						)
					}

					for (const line of fillLines) {
						this._drawLine(line)
					}
					this._renderSVG()
				},

				_moveStart() {
					this.$.data.moveStart()
				},

				_move(x, y, px, py) {
					this.$.data.move(x, y, px, py)
					this._render()
				},

				_moveEnd() {
					this.$.data.moveEnd()
				},

				_miniMove(dx, dy) {
					this.$.data.miniMove(dx, dy)
					this._render()
				},

				_toneStart(x, y) {
					this.$.data.toneStart()
					this._tone(x, y, x, y)
				},

				_tone(x, y, px, py) {
					var tonePoints = this.$.data.tone(x, y, px, py, {
						pattern: this.tonePattern,
						radius: this.toneRadius,
						spacing: this.toneSpacing,
						offX: this.toneOffsetX,
						offY: this.toneOffsetY,
					})
					for (var p in tonePoints) {
						this._drawLine(tonePoints[p])
					}
					this._renderSVG()
				},

				_toneEnd(x, y) {
					this.$.data.toneEnd()
				},

				// Rendering-related

				_drawLine(points) {
					const isDot =
						points.length == 4 &&
						points[0] == points[2] &&
						points[1] == points[3]

					if (isDot) {
						if (
							this.renderType == "vector" ||
							this.renderType == "quackbarc" ||
							this.renderType == "mixed" ||
							this.renderType == "clanker"
						) {
							// This offset should shorten the screentone line if the top-left point
							// ever goes OOB on the top and/or on the left side
							const topleftOffset = Math.max(
								points[0] - Math.max(points[0] - 1, 0),
								points[1] - Math.max(points[1] - 1, 0),
							)
							points = [
								points[0] - topleftOffset,
								points[1] - topleftOffset,
								points[0] + 1,
								points[1] + 1,
							]
						} else {
							this._canvas.beginPath()
							this._canvas.arc(
								points[0],
								points[1],
								1.5,
								0,
								Math.PI * 2,
							)
							this._canvas.fill()
						}
					}

					this._canvas.beginPath()
					this._canvas.moveTo(points[0], points[1])
					for (var i = 2; i < points.length; i += 2) {
						this._canvas.lineTo(points[i], points[i + 1])
					}
					this._canvas.stroke()
				},

				_clear() {
					this._canvas.fillStyle = "white"
					this._canvas.fillRect(0, 0, 800, 600)
					this._canvas.fillStyle = "black"
				},

				_animate(timestamp) {
					if (this._lastTimestamp) {
						var _animationSpeed = Math.pow(
							10,
							this.animationSpeed / 10 + 1,
						)

						var timeDelta = timestamp - this._lastTimestamp
						var pointsToDraw = (timeDelta / 1000) * _animationSpeed
						var pointsDrawn = 0

						while (pointsDrawn < pointsToDraw && this.playing) {
							this._canvas.drawImage(
								this._canvas2.canvas,
								0,
								0,
								800,
								600,
							)
							this._drawLine(
								this.$.data.lines[
									this._playProgressLines
								].slice(0, this._playProgressPoints + 4),
							)

							pointsDrawn++
							this._playProgressPoints += 2
							if (
								this._playProgressPoints >=
								this.$.data.lines[this._playProgressLines]
									.length -
									2
							) {
								this._playProgressPoints = 0
								this._playProgressLines++
								this._canvas2.drawImage(
									this._canvas.canvas,
									0,
									0,
									800,
									600,
								)
								if (
									this._playProgressLines >=
									this.$.data.lines.length
								) {
									break
								}
							}
						}
					} else {
						this._canvas2.drawImage(
							this._canvas.canvas,
							0,
							0,
							800,
							600,
						)
					}

					this._lastTimestamp = timestamp

					if (
						this.playing &&
						this._playProgressLines < this.$.data.lines.length
					) {
						window.requestAnimationFrame(this._animate.bind(this))
					} else {
						this._setPlaying(false)
					}
				},

				async _render() {
					this._keepRendering = true
					if (!this._rendering) {
						// This while loop acts as a debounce;
						// subsequent _render calls would set _keepRendering to true and
						// re-render the canvas once it's done painting.
						while (this._keepRendering) {
							this._keepRendering = false
							this._rendering = true
							this._renderInner()

							// Give the canvas some time to do the render.
							await new Promise((res, rej) =>
								window.requestAnimationFrame(res),
							)
						}

						this._rendering = false
					}
				},

				_renderInner() {
					this._clear()

					for (var i in this.$.data.lines) {
						this._drawLine(this.$.data.lines[i])
					}
					this._renderSVG()
				},

				_renderSVG() {
					const svg = this.$.vectorCanvas
					const namespace = "http://www.w3.org/2000/svg"
					const lines = this.$.data.lines.slice()
					lines.push(...this.$.data.currentLines)
					const fragment = document.createDocumentFragment()
					if (
						this.renderType == "mixed" ||
						this.renderType == "clanker"
					) {
						const defs = document.createElementNS(namespace, "defs")
						const filter = document.createElementNS(
							namespace,
							"filter",
						)
						filter.setAttribute("id", "mixedTexture")
						filter.setAttribute("x", "-2%")
						filter.setAttribute("y", "-2%")
						filter.setAttribute("width", "104%")
						filter.setAttribute("height", "104%")

						const noise = document.createElementNS(
							namespace,
							"feTurbulence",
						)
						noise.setAttribute("type", "fractalNoise")
						noise.setAttribute(
							"baseFrequency",
							this.renderType == "mixed" ||
								this.renderType == "clanker"
								? "0.15"
								: "0.06",
						)
						noise.setAttribute(
							"numOctaves",
							this.renderType == "mixed" ||
								this.renderType == "clanker"
								? "3"
								: "1",
						)
						noise.setAttribute("seed", "7")
						noise.setAttribute("result", "grain")

						const displacement = document.createElementNS(
							namespace,
							"feDisplacementMap",
						)
						displacement.setAttribute("in", "SourceGraphic")
						displacement.setAttribute("in2", "grain")
						displacement.setAttribute(
							"scale",
							this.renderType == "mixed" ||
								this.renderType == "clanker"
								? "1.0"
								: "0.55",
						)
						displacement.setAttribute("xChannelSelector", "R")
						displacement.setAttribute("yChannelSelector", "G")
						displacement.setAttribute("result", "displaced")

						const blur = document.createElementNS(
							namespace,
							"feGaussianBlur",
						)
						blur.setAttribute("in", "displaced")
						blur.setAttribute(
							"stdDeviation",
							this.renderType == "mixed" ||
								this.renderType == "clanker"
								? "0.35"
								: "0.18",
						)

						filter.append(noise, displacement, blur)
						defs.appendChild(filter)
						fragment.appendChild(defs)
					}
					const background = document.createElementNS(
						namespace,
						"rect",
					)
					background.setAttribute("width", "800")
					background.setAttribute("height", "600")
					background.setAttribute("fill", "white")
					fragment.appendChild(background)

					const group = document.createElementNS(namespace, "g")
					if (this.flipped) {
						group.setAttribute(
							"transform",
							"translate(800 0) scale(-1 1)",
						)
					}
					group.setAttribute("fill", "none")
					group.setAttribute("stroke", "black")
					group.setAttribute("stroke-width", "3")
					group.setAttribute("stroke-linecap", this._canvas.lineCap)
					group.setAttribute(
						"stroke-linejoin",
						this.renderType == "vector"
							? "round"
							: this._canvas.lineJoin,
					)
					if (
						this.renderType == "mixed" ||
						this.renderType == "clanker"
					) {
						group.setAttribute("filter", "url(#mixedTexture)")
					}

					for (const line of lines) {
						if (line.length < 4) {
							continue
						}

						const isDot =
							line.length == 4 &&
							line[0] == line[2] &&
							line[1] == line[3]
						const isVectorDisplay =
							this.renderType == "vector" ||
							this.renderType == "mixed" ||
							this.renderType == "clanker"
						const galleryDot = isVectorDisplay && isDot
						if (isDot && !isVectorDisplay) {
							const circle = document.createElementNS(
								namespace,
								"circle",
							)
							circle.setAttribute("cx", line[0])
							circle.setAttribute("cy", line[1])
							circle.setAttribute("r", "1.5")
							circle.setAttribute("fill", "black")
							group.appendChild(circle)
							continue
						}

						const path = document.createElementNS(namespace, "path")
						let d = galleryDot
							? `M ${line[0]} ${line[1]} L ${line[0] + 2} ${line[1] + 2}`
							: `M ${line[0]} ${line[1]}`
						for (let i = 2; i < line.length; i += 2) {
							if (galleryDot) {
								break
							}
							d += ` L ${line[i]} ${line[i + 1]}`
						}
						path.setAttribute("d", d)
						group.appendChild(path)
					}

					fragment.appendChild(group)
					svg.replaceChildren(fragment)
				},

				// Computed properties

				_canEdit(canEdit, disabled) {
					return canEdit && !disabled
				},

				_tool(desiredTool, activeTool, activeKeyTool) {
					return activeKeyTool || activeTool || desiredTool
				},

				_eraseStrokes(setting, active) {
					return active || setting
				},

				_cursor: function (
					disabled,
					tool,
					eraseStrokes,
					eraserRadius,
					toneRadius,
					bounds,
				) {
					if (!this._readied || disabled) {
						return "crosshair"
					}

					const canvasRatio = bounds.width / this.$.sketchCanvas.width

					switch (tool) {
						case "pan":
							return "inherit" // Inherit <zoom-container>'s cursor
						case "eraser":
							const thickness = eraseStrokes ? 4 : 2
							return this._getRadiusCursorURI(
								Math.round(eraserRadius * canvasRatio),
								thickness,
							)
						case "screentone":
							return this._getRadiusCursorURI(
								Math.round(toneRadius * canvasRatio),
							)
						case "move":
							return "move"
						default:
							return "crosshair"
					}
				},

				_getRadiusCursorURI: function (radius, thickness = 2) {
					const svgRadius = radius + 2 // +2 is the stroke width
					const svgSize = (radius + 2) * 2
					const svg = [
						`<svg`,
						`xmlns="http://www.w3.org/2000/svg"`,
						`viewBox="0 0 ${svgSize} ${svgSize}"`,
						`width="${svgSize}"`,
						`height="${svgSize}">`,
						`<circle`,
						`cx="${svgRadius}"`,
						`cy="${svgRadius}"`,
						`r="${radius}"`,
						`stroke="gray"`,
						`stroke-width="${thickness}"`,
						`fill-opacity="0"/>`,
						`</svg>`,
					].join(" ")

					return `url('data:image/svg+xml,${svg}') ${svgRadius} ${svgRadius}, crosshair`
				},
			})
		})()
	</script>
</dom-module>
